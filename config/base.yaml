# config/base.yaml — baseline 기본값 (2026-08-26 보완)
# 팀 실험 인프라 규약 기준. 이 파일은 리포에 포함(공용 기본값, 유일한 커밋 예외).
# 실험별 config.yaml은 바뀐 줄만 적고, 이 파일 위에 덮어씀.
#
# [값 상태 표기]
#   확정      — 이 값 그대로 씀
#   확정(잠정) — 지금은 이 값으로 가되, 명시된 시점에 재확인
#   TODO      — 실측/합의 대기. 담당자·선행 항목 명시. 채워지기 전엔 baseline 실행 불가
#   auto      — 실행 시 코드가 자동으로 채움. 사람이 적지 않음

# ─────────────────────────────
# ⓪ 실험 신원 (실험별 config에서 채움. base에는 자리만)
# ─────────────────────────────
name: null            # 예: tm001_I_chunk500  — 사람_번호_무게_바꾼것
weight: null          # F(무료) / I(재인덱싱) / R(재추출)
changed: null         # 예: "chunk_size 700→500"  — 한 줄만. 두 줄이면 규칙 위반
git_commit: null      # auto — 실행 진입점에서 git log -1 --format=%h
git_dirty: null       # auto — git status --short 가 비어있지 않으면 true
                      #        ⭐true면 그 실험은 재현 불가. 최종 실험은 false여야 함

# ─────────────────────────────
# ① 재료 버전 6칸 (필드명 고정 — 절대 개명 금지)
# ─────────────────────────────
corpus: v2            # 확정 2026-08-30 (박예진) — shared_data/processed/corpus_v2
                      #   (v1에서 승격. interim/md 아닌 공식 전처리 코퍼스가 정본)
                      #   ⚠️ interim/md(미가공)와 다름. 전처리 완료 후 산출물만
                      #   "코퍼스"로 취급 (2026-08-27 박예진 확정)
preprocess: v2        # 확정 2026-08-31 (박예진) — v1에서 승격
table: v4                     # 확정 2026-09-06 — rfp_extraction_table_v4.
                              #   schema 1-12-2/v3, 1,200행·100문서×12필드, 검수 대기 0
                              #   상태 5종: value_present(896)/field_absent(254)/
                              #   external_reference(47)/not_disclosed(2)/conflict(1)/
                              #   extraction_failed(0)
                              #   v3 대비 RFP-000067·RFP-000081의 컨소시엄 요건 2행을
                              #   field_absent에서 value_present로 원문 근거에 맞게 정정
                              #   공식 이름표: extraction_metadata.json (VERSION.txt 아님)
index: v2             # 확정 2026-09-02 — shared_data/processed/index_v2 공식 공개.
                      #   chunks_v3(검색대상 14,828청크·98문서) + document_registry_v2 +
                      #   text-embedding-3-small(1536차원)로 생성.
                      #   ⚠️ index_v1은 chunking v1 / extraction v2 로 낡아 실행 코드가
                      #   차단한다(vector_store.validate_index_tag). v1은 삭제하지 않고 보존.
index_build_timestamp: null   # auto — 인덱스 생성 시각. 4-9-2 꼬리표, 5명 병렬 작업
                              #   버전 구분용. reference_datetime과 무관(별개 값)
evalset: v2           # 확정 2026-09-06 — data/evalsets/final/v2/VERSION.txt
                      #   (evalset v2 / corpus v2 / chunking v3). 연습 문항 8개는
                      #   /srv/rfp/evalset/practice_items.jsonl
scorer: v2            # 확정 2026-09-06 — src/grader 채점기 v2

# ─────────────────────────────
# ② 청킹 (4-7, 4-7-1) — 박예진 담당
# ─────────────────────────────
chunk_size: 1500              # baseline 시작값 2026-08-31 (C-1 ①, 박예진) — 글자 기준.
                              #   ⚠️ 최종 확정값 아님. 검색 평가 후 확정.
                              #   토큰 한도 안에 든다는 것과 검색 품질이 최적이라는 것은
                              #   다른 문제 (실측 최대 4,369토큰 / 한도 8,192)
chunk_overlap: 150            # baseline 시작값 2026-08-31 (C-1 ②, 박예진) —
                              #   문단 p90 107자 기준 10%. ⚠️ 최종 확정값 아님
chunking_version: v3          # 병합 정책 개정으로 v2와 결과가 다름 → 폴더 분리
chunk_unit: "char"            # 확정 — 글자 수 기준. 1-15 완료 후에도 char 단위 유지로 확정
                              #   (토큰 환산은 참고 지표로만 사용, 실제 자르는 기준은 글자 수)
table_chunk_threshold: 1500   # 확정 2026-08-31 (C-2 ①, 박예진) — 1000에서 변경.
                              #   실측: 1,500자 이하 통째 유지 86.7%, 분할 대상 절반으로 감소
                              #   (8/27 "재측정 예정" 캐비어트 — 이 실측으로 해소됨)
table_format: "html"          # 확정 — 병합 셀 100%라 마크다운 변환 원천 불가 (1-13-1)
table_empty_cell: "skip_in_search"   # 확정 — 검색 텍스트에서만 빈 셀 무시.
                                     #   행 구조는 유지(C-2 ④, 박예진). ⚠️HTML 원본 수정
                                     #   금지 — rowspan 14,870 / colspan 57,796으로 병합 대량
table_degraded_threshold: 0.6 # 확정 2026-08-31 (C-2 ②, 박예진 실측) — 실측 p90 0.597로
                              #   0.6 임계값의 근거가 확보됨(8/27 "임시값, 수정 필요"
                              #   캐비어트 해소). 판정은 검색 대상 표에만 적용(별첨·서식
                              #   264개 제외 → 본문 517개). degraded 청크는 값을 만들지
                              #   않고 원문 위치만 안내

# ─────────────────────────────
# ③ 임베딩 (4-8) — 이태민 담당
# ─────────────────────────────
# ⭐ 2026-08-31 방향 전환: 원래 목표가 "오픈AI vs 로컬 모델 비교"였음. 로컬
#   트랙 속도 문제로, 이태민은 오픈AI 트랙을 먼저 진행 (로컬 트랙은 김태윤이
#   이어감). 담당·파이프라인 구조는 그대로, 모델 트랙만 전환.
embedding_provider: "openai"  # 확정(재확정) 2026-08-31 — 한 차례 후보비교로
                              #   철회했다가, baseline을 오늘 실제로 돌리기로 하며
                              #   오픈AI 트랙으로 재확정. 저비용 시작 원칙(측정 먼저,
                              #   승격 나중) 적용
embedding_model: "text-embedding-3-small"  # 확정 2026-08-31 — 저비용 시작값.
                              #   필요시 text-embedding-3-large로 승격 검토(측정 후).
                              #   로컬 후보 실측 기록(참고용, 김태윤 트랙에서 이어감):
                              #   bge-m3/KURE-v1(p95 일반631·표1550), Qwen3-8B(688/1401),
                              #   EXAONE(597/1350), HyperCLOVA(595/1324), Gemma(615/1120)
                              #   — e5-large/KoE5는 512토큰 제한으로 표 청크 92% 초과,
                              #   로컬 트랙에서도 사실상 배제 쪽
embedding_max_length: 8192    # 확정 — OpenAI text-embedding-3-small 입력 한도
embedding_prefix_query: null  # TODO — 오픈AI 임베딩은 접두어 규약 없음 (e5 계열만 해당)
embedding_prefix_doc: null    # TODO — 위와 동일
data_egress_confirmed: true   # 확정 2026-08-31 — RFP 문서를 오픈AI API로 전송하는
                              #   것에 대한 팀 확인 완료. baseline 실제 실행 승인.

# ─────────────────────────────
# ④ 검색 (4-9-x) — 이태민 담당
# ─────────────────────────────
vector_store_type: "lightweight"   # 확정(잠정) 2026-08-26 (4-9-1) — 전용 벡터DB 없이도
                                   #   가벼운 방식 가능한 수준으로 판단.
                                   #   조각 수: 약 1만개 추정 → 실측 19,381개
                                   #   (2026-09-01 chunks_v3, 박예진). 추정의 약 2배이므로
                                   #   lightweight 유지 여부는 이태민 재확인
vector_store_upsert: true          # 확정 (4-9-1) — 문서 단위 upsert 지원 필수
vector_store_delete: false         # 확정 (4-9-1) — 물리 삭제 불필요, 상태 플래그로 흡수
vector_store_soft_delete: true     # 확정 (4-9-1) — 상태 플래그(비활성화) 지원 필수.
                                   #   갱신 범위(추가+수정만)·마감 경과 처리와 같은 메커니즘 재사용
vector_store_metadata_filter: ["사업명", "입찰_참여_마감일"]  # 확정 2026-08-27 (4-9-5)
                                   #   baseline 필터 필드. 발주기관은 대기(기관명
                                   #   매칭 정규화 필요 수준이 임현진 2-2-2에 달림 —
                                   #   이태민 단독 결정 아님). 사업금액·공고번호·
                                   #   입찰 참여 시작일은 신뢰도 낮아 제외
vector_store_per_doc_metadata: ["doc_id", "corpus_version"]
                                   # 정정 2026-08-31 — duplicate_name_flag·
                                   #   content_duplicate_of는 vector_store.py에서
                                   #   제거됨(message.txt 9번: 사업명 기반 중복
                                   #   판정 대신 document_registry_v2의
                                   #   retrieval_eligible·duplicate_of_document_id를
                                   #   build_index 단계에서만 신뢰)
# duplicate_name_check_on_upsert 키 삭제 2026-08-31 — vector_store.py의
# refresh_duplicate_name_flags()를 제거해서(message.txt 9번) 더 이상 참조할
# 함수가 없음. 콘텐츠 중복은 document_registry_v2의 retrieval_eligible로 처리.
config_mismatch_check: true       # 확정 2026-08-27 — 인덱싱 시작 전 인덱스 꼬리표의
                                   #   chunk_size 등과 현재 config 비교, 다르면 중단하고
                                   #   "index_v2를 만드세요" 안내. 섞임을 사전 차단
similarity_metric: "cosine"   # 확정(잠정) — 임베딩 모델 규약과 대조. 모델 확정 시 재확인
top_k: 5                      # 확정(잠정) 2026-08-27 — baseline 시작값. 채점(3-2)은
                              #   이 결과를 k=3/5 등 여러 단계로 잘라 별도 분석 (김하루 협의).
                              #   1-15 토큰 분포 도착 시 재확인
hybrid_search: false          # 확정 — baseline은 벡터 단독.
                              #   투입은 1-14 표현 성격 + 3-2 recall 결과 확인 후
hybrid_fusion: "rrf"          # 확정 — 결합은 RRF(순위 결합), 가중합 아님 (4-9-4)
routing_method: "rule_based"  # 확정(잠정) — F-0 경로 분기. 1-2·1-18 도착 시 재검토 (4-10-1)
routing_fallback: "qa"        # 확정 — 분기 실패 시 QA형 + 재시도 (4-10-1)
active_doc_state: true        # 확정 — 대화 이력 대신 활성 문서 ID 상태 유지 (4-14)

# ─────────────────────────────
# ⑤ 생성 (4-12, 4-12-1) — 이태민 담당
# ─────────────────────────────
generation_provider: "openai"  # 확정 2026-08-31 — 오픈AI 트랙 우선 진행
generation_model: "gpt-5-mini"  # 재확정 2026-09-02 — gpt-4o-mini는 팀 API
                              #   정책상 허용 모델 목록(gpt-5-mini, gpt-5-nano,
                              #   text-embedding-3-small)에 없어 호출 자체가
                              #   막힘(rate_limit_exceeded, RPM 0). 실제 서버
                              #   테스트로 확인 후 gpt-5-mini로 교체.
                              #   더 낮추려면 gpt-5-nano(저비용, 품질 더 낮음).
                              #   팀 전체 API 예산 $20 한도 — 초과 시 키 즉시
                              #   비활성화되니 주의(!usage로 잔여량 확인 가능).
                              #   로컬 후보(참고용, 김태윤 트랙에서 이어감): Qwen/Qwen3-8B,
                              #   LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct(NC 배제 대상),
                              #   naver-hyperclovax/HyperCLOVAX-SEED-Text-Instruct-1.5B,
                              #   google/gemma-3-12b-it, meta-llama/Llama-3.1-8B-Instruct
                              #   (HF 접근 승인 대기)
temperature: null             # 확정 2026-09-02 — GPT-5 Mini에서는 **API 기본값을
                              #   사용하며 동일 문장의 완전한 재현은 보장하지 않음**.
                              #   gpt-5-mini는 temperature 자체를 지원하지 않아
                              #   (기본값만 허용) 요청에 이 키를 아예 싣지 않는다.
                              #   null = "보내지 않음"이라는 뜻이며, 예전처럼
                              #   `temperature: 0`을 확정값처럼 적어두고 실제로는
                              #   무시하던 모순을 제거했다.
                              #   ⚠️ temperature를 지원하는 모델로 바꿀 때만
                              #   숫자를 채운다(그 경우에만 요청에 실린다).
top_p: null                   # 확정 2026-09-02 — gpt-5-mini 미지원. 보내지 않음
logprobs: null                # 확정 2026-09-02 — gpt-5-mini 미지원. 보내지 않음
max_completion_tokens: 4096   # 확정 2026-09-02 시작값 — GPT-5 계열은 max_tokens가
                              #   아니라 max_completion_tokens를 받는다.
                              #   잘림이 확인되면 이 값만 올린다.
# max_tokens 키 삭제 2026-09-02 — gpt-5-mini가 거부하는 인자다. 이름만 남겨두면
#   다른 모델용 설정이 섞여 들어가므로 아예 없앤다.
abstain_layers: ["prompt"]    # 확정 — baseline은 프롬프트 지시만.
                              #   검색상태 판정·생성후 검증은 baseline 이후
# 생성+임베딩 비용 계산용(cost_usd).
# ⚠️ 단위는 **100만(1M) 토큰당 달러**다. 키 이름에 단위를 박아 1천 토큰 단가와
#   헷갈리지 않게 한다(예전 input_per_1k 이름은 폐기 — 값이 1M 기준인데 이름은
#   1k라 1,000배 오차가 날 수 있었다).
# 출처: OpenAI 공식 가격표 (2026-09-02 확인)
#   - gpt-5-mini            : 입력 $0.25 / 캐시입력 $0.025 / 출력 $2.00  (per 1M)
#   - text-embedding-3-small: 입력 $0.02                               (per 1M)
pricing_unit: "per_1m_tokens"
pricing:
  gpt-5-mini:
    input_per_1m: 0.25
    cached_input_per_1m: 0.025
    output_per_1m: 2.0
  text-embedding-3-small:
    input_per_1m: 0.02
# ─────────────────────────────
# ⑥ 프롬프트 5종 (파일명만 적음. 버전은 파일명에)
# ─────────────────────────────
prompt_extract:   "extract_v1.txt"     # B-2 구조화 추출  — 박예진  ⭐호출 수 최다, 비용 최대
                                       #   baseline에서는 이미 완성된 추출표 사용, 재호출 안 함
prompt_route:     "route_v1.txt"       # F-0 경로 분기    — 이태민
                                       #   ⚠️ baseline은 규칙 기반이라 이 파일 미호출.
                                       #   LLM 방식으로 승격할 때만 사용
prompt_condition: "condition_v1.txt"   # G-2 조건 번역    — 이태민
                                       #   ⚠️ baseline은 규칙 기반이라 이 파일 미호출.
                                       #   자연어→필드/연산자 변환을 LLM으로 할 때만 사용
prompt_generate:  "generate_v3.txt"    # J  답변 생성     — 이태민 (baseline에서 실제 사용)
                                       #   v3(2026-09-03): 형식 변환 규칙 추가 —
                                       #   요약·목록·표·체크리스트 요청은 "내용 추가"가
                                       #   아니라 "형식 변환"이며, 근거에 없는 사실·조건·
                                       #   절차·판단 기준을 새로 만들지 않는다.
                                       #   (실제 API 실행에서 체크포인트 답변이 원문에
                                       #    없는 우선순위·영향분석·달성지표를 덧붙인
                                       #    문제를 막기 위한 변경)
                                       #   v2의 근거 인용 규약(USED_EVIDENCE)은 글자 그대로
                                       #   유지. v1·v2는 수정하지 않고 보존(팀 규약)
# prompt_score는 없음 — 확정 2026-08-31: 체크리스트3(김하루) 실제 채점 프롬프트
#   (judge_checkpoint.v1.md, judge_faithfulness.v1.md, judge_list_item.v1.md)를
#   그대로 사용. 체크리스트4 쪽 score_v1.txt는 별도로 만들지 않음
# ⚠️ 파일은 src/prompts/ 아래. 수정 시 같은 파일을 고치지 말고 _v2 를 새로 만든다
# ⚠️ few-shot 예시가 평가셋 문항과 겹치면 부정행위. 파일 상단에 예시 출처 주석 필수

# ─────────────────────────────
# ⑦ 문서·버전 추적 (4-9-2·4-7-2, C→D 연결 필수 필드)
# ─────────────────────────────
document_registry_version: v2  # 확정 2026-08-30 — document_registry_v2.
                              #   identity_v2(document_identity_v2.csv)도 이 폴더 안에 있다
retrieval_eligible_only: true  # 확정 2026-08-31 — 검색은 document_registry_v2의
                              #   retrieval_eligible=true인 98문서만 대상(중복 2건 제외)
track_document_version: true  # 확정 — 모든 청크·벡터에 document_id, document_version,
                              #   processed_sha256(전처리 md 해시), sidecar_sha256
                              #   (위치정보 해시) 저장. 같은 document_id에 버전/해시
                              #   섞이면 인덱싱 중단
extraction_version: "v4"      # 확정 2026-09-06 — rfp_extraction_table_v4 기준.
                              #   ①의 table과 항상 같아야 함.
                              #   ★뜻: "지금 구조화 조회에 쓰는 추출표 버전".
                              #     인덱스를 만들 당시의 계보와는 다른 개념이다 —
                              #     그 값은 아래 index_source_extraction_version.
index_source_extraction_version: "v3"
                              # 확정 2026-09-06 — 현재 index_v2를 만든 chunks_v3의
                              #   추출표 계보. chunks_v3/VERSION.txt의
                              #   `table version : v3`, index_v2/index_tag.json의
                              #   `extraction_version: "v3"`와 같은 값이어야 한다.
                              #   ★왜 분리했나: 예전에는 extraction_version 하나가
                              #     "현재 조회용 추출표"와 "인덱스 생성 당시 계보"
                              #     두 뜻으로 쓰였다. 추출표만 v4로 승격되자 두 뜻이
                              #     갈라졌는데 코드는 둘이 같아야 한다고 검사해
                              #     베이스라인 실행이 통째로 막혔다(재현: repro/before.log).
                              #   ⚠️ 이 값은 인덱스를 새로 만들 때만 바뀐다. 실제
                              #     chunks_v4로 index_v3를 만들면 그때 v4가 된다.
                              #     추출표를 올렸다고 이 값을 따라 올리지 않는다.
schema_version: "1-12-2/v3"   # 확정 2026-09-01 — extraction_metadata.json의
                              #   schema_version 값



# ─────────────────────────────
# ⑧ 실행 시점 정보 (4-10-2)
# ─────────────────────────────
reference_datetime_source: "external"  # 확정 — 코드가 현재 시각을 직접 읽지 않고 외부 주입
deadline_urgent_days: null             # 실험/운영 옵션 — null이면 임박 필터 off.
                                       # 3/7/14처럼 기준 시각부터 N일 이내만 남김.
reference_datetime: "2024-06-01"       # 확정 2026-08-26 (박예진 1-9 실측) +
                                       #   2026-08-27 임현진(2-6-2) 공식 확정 — 값 일치 확인
                                       #   ⭐now 금지. 평가셋이 저절로 틀려짐 (1-9 ④)
# ⭐ 2026-09-02 (4-4 확정) 마감일 자료 출처를 identity_v2로 통일.
#    - 마감일 값·근거 위치 : document_registry_v2/document_identity_v2.csv (identity_v2)
#    - 일반 QA 원문 근거   : chunks_v3
#    - 나머지 12필드       : rfp_extraction_table_v4
#    원본 shared_data/raw/data_list.csv를 실행 경로가 직접 읽던 코드는 폐기했다.
identity_source: "identity_v2"          # 확정 2026-09-02 — 마감일·발주기관·사업명의 유일 출처
deadline_filter_field: "bid_deadline"   # 확정 2026-09-02 — identity_v2의 실제 컬럼명 그대로
                                       #   (예전 값 "입찰 참여 마감일"은 data_list.csv 컬럼명이라
                                       #    identity_v2에는 존재하지 않는다)
deadline_filter_disclosure: true      # 확정, 정정(김태윤) — 단순 고지가 아니라 아래
                                       #   메시지를 코드로 고정 부착(모델 판단 아님,
                                       #   1-4-1② 좌표 기계부착과 동일 원칙)
deadline_filter_disclosure_message: "입찰 마감 기준입니다. 이 필터는 느슨한 방향으로 틀릴 수 있습니다 — 제안서 제출은 이미 마감됐는데 입찰이 끝나지 않아 '지원 가능'으로 표시되는 경우가 있습니다."
                                       # 위험 방향: 필터가 느슨하게 틀림(놓침이 아니라
                                       #   못하는 걸 할 수 있다고 보여줌 — 1-2④ 실행단계,
                                       #   피해 최대 지점의 사고)
deadline_missing_policy: "show_as_unknown"  # 확정 — 마감일 미상 8건은 "미상" 표시 후 통과(제외 안 함)
deadline_filter_default:               # 확정 — 태스크별 마감 필터 기본값 (1-9 ④)
  select: true                         #   선별형: 필터 켬
  extract: false                       #   추출형: 필터 끔
  qa: false                            #   QA형:   필터 끔
  compare: false                       #   비교형: 필터 끔

# ─────────────────────────────
# [참고] config 범위 밖 — 채점기(scorer) 쪽 설정
# ─────────────────────────────
# - 4-11-1 출력 형식 위반 채점 (확정: 감점 포함)
# - 4-12-1 기권율 분리 집계 (과잉거절 / 정탐)
# - 4-13  좌표 채점 (문서+장절+표번호 대조)
# - 3-4-1 선별형 채점: recall 가중 + 보조지표 "완전 재현 비율"
