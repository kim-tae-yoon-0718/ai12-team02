<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">입찰메이트 3단계 하이브리드 라우팅 구조</title>
  <desc id="desc">질문을 확실성 검사 후 규칙 기반 빠른 경로와 LLM 안전망으로 나누어 처리하고 근거가 있는 답변으로 합치는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1098" height="338" rx="22" fill="url(#bg)" stroke="#CBD5E1"/>

  <text x="550" y="37" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">
    확실한 질문은 코드로 빠르게, 복잡한 질문만 LLM으로 신중하게
  </text>

  <rect x="32" y="119" width="126" height="64" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="95" y="145" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">사용자 질문</text>
  <text x="95" y="166" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" fill="#64748B">RFP 검색·비교·설명</text>

  <line x1="158" y1="151" x2="192" y2="151" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="204" y="110" width="150" height="82" rx="16" fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="279" y="142" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="15" font-weight="700" fill="#312E81">지원 여부 검사</text>
  <text x="279" y="165" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" fill="#4F46E5">확실할 때만 빠르게</text>

  <path d="M354 145 C378 145 374 108 398 108" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M354 157 C378 157 374 234 398 234" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="410" y="62" width="300" height="106" rx="17" fill="#ECFDF5" stroke="#34D399" stroke-width="1.6"/>
  <rect x="430" y="77" width="126" height="26" rx="13" fill="#059669"/>
  <text x="493" y="95" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">빠른 경로 · 32/50</text>
  <text x="430" y="125" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">전체 선별 · 한 값 조회 · 문서 비교</text>
  <text x="430" y="148" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" fill="#047857">추출표 + 코드로 처리 · API 호출 0</text>

  <rect x="410" y="186" width="300" height="106" rx="17" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <rect x="430" y="201" width="142" height="26" rx="13" fill="#EA580C"/>
  <text x="501" y="219" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">LLM 안전망 · 18/50</text>
  <text x="430" y="249" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="13" font-weight="600" fill="#9A3412">독립 해석 → 적절한 도구 선택</text>
  <text x="430" y="272" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" fill="#C2410C">결과가 부족하면 추가 조회 후 답변</text>

  <path d="M710 115 C738 115 738 146 765 146" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710 239 C738 239 738 166 765 166" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="778" y="111" width="290" height="88" rx="17" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.7"/>
  <text x="923" y="144" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A">근거가 있는 최종 답변</text>
  <text x="923" y="170" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" fill="#475569">검색 결과 · 출처 · 누락 여부를 함께 확인</text>

  <rect x="778" y="216" width="91" height="44" rx="12" fill="#DBEAFE"/>
  <rect x="878" y="216" width="91" height="44" rx="12" fill="#DCFCE7"/>
  <rect x="978" y="216" width="90" height="44" rx="12" fill="#FEF3C7"/>
  <text x="823.5" y="234" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="10" fill="#1E40AF">내용 점수</text>
  <text x="823.5" y="250" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">0.8000 유지</text>
  <text x="923.5" y="234" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="10" fill="#166534">API 비용</text>
  <text x="923.5" y="250" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532D">50.96% ↓</text>
  <text x="1023" y="234" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="10" fill="#92400E">실행 시간</text>
  <text x="1023" y="250" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350F">52.98% ↓</text>

  <text x="923" y="286" text-anchor="middle" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="10.5" fill="#64748B">
    동일 평가셋·채점기·추출표(v2/v2/v4)에서 2단계－1·2·3차와 비교
  </text>
</svg>